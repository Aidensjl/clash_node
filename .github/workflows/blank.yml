name: 同步 FreeSubsCheck

on:
  push:
    branches:
      - master
  schedule:
      - cron: '0 */2 * * *'  # 每2小时自动更新
  workflow_dispatch:

jobs:
  sync:
    # 防止 Actions 自己 push 后再次触发
    if: github.actor != 'github-actions[bot]'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # 1. 获取自己的仓库
      - name: Checkout 当前仓库
        uses: actions/checkout@v6
      
      # 1.1 python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 安装依赖
        run: python -m pip install --upgrade pip pyyaml
          

      # 2. 获取 FreeSubsCheck https://github.com/kooker/FreeSubsCheck  到临时目录
      - name: 获取 FreeSubsCheck
        uses: actions/checkout@v6
        with:
          repository: kooker/FreeSubsCheck
          ref: main
          path: external/FreeSubsCheck

      # 3. 删除原来的 FreeSubsCheck
      - name: 准备同步目录
        run: |
          pip install pyyaml
          rm -rf MyNode
          mkdir -p MyNode

      # 4. 复制 FreeSubsCheck 内容
      - name: 复制文件
        run: |
          cp -a external/FreeSubsCheck/. MyNode/

          # 删除外部仓库的 Git 信息
          rm -rf MyNode/.git

      # 5. 删除临时目录
      - name: 清理临时文件
        run: |
          rm -rf external

      # 6. 查看最终文件
      - name: 查看文件
        run: |
          echo "===== MyNode 文件 ====="
          find MyNode -type f | sort

      # 6.1 查看最终文件
      - name: 转换 base64.txt
        if: ${{ hashFiles('MyNode/base64.txt') != '' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/python_tool
        run: |
          python python_tool/test01.py to-clash ./MyNode/base64.txt -o ./MyNode/base64.yaml \
            || echo "::warning::base64.txt 转换失败"

      - name: 转换 byxiaoxi.txt
        if: ${{ hashFiles('MyNode/byxiaoxi.txt') != '' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/python_tool
        run: |
          python python_tool/test01.py to-clash ./MyNode/byxiaoxi.txt -o ./MyNode/byxiaoxi.yaml \
            || echo "::warning::byxiaoxi.txt 转换失败"

      - name: 转换 kooker.jp.txt
        if: ${{ hashFiles('MyNode/kooker.jp.txt') != '' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/python_tool
        run: |
          python python_tool/test01.py to-clash ./MyNode/kooker.jp.txt -o ./MyNode/kooker.yaml \
            || echo "::warning::kooker.jp.txt 转换失败"
      # 6.2. 查看转换结果
      - name: 查看 MyNode 转换结果
        run: |
          echo "===== MyNode 内容 ====="
          ls -la MyNode/
          echo "===== 各文件节点数 ====="
          for f in MyNode/*.yaml; do
            [ -f "$f" ] || continue
            n=$(python -c "import yaml,sys; d=yaml.safe_load(open('$f')); print(len(d.get('proxies') or []))" 2>/dev/null || echo 0)
            echo "  $f: $n"
          done
      # 6.3 合并所有 yaml
      - name: test03.py合并 MyNode 下所有 yaml,名称为node_x
        run: |
          python python_tool/test03.py MyNode \
            -o MyNode/merged.yml \
            --exclude merged.yml

      - name: test02.py合并 MyNode 下所有 yaml,没有处理名称
        run: |
          python python_tool/test02.py MyNode \
            -o MyNode/merged_no.yml \
            --exclude merged.yml

      - name: test04.py处理 MyNode 下的merged_no.yml为可用merged_done
        run: |
          python python_tool/test04.py MyNode/merged_no.yml MyNode/merged_done.yml
          
      
      # 7. 提交更新
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 如果之前 MyNode 已经被错误地记录成子模块，
          # 先从 Git 索引中删除这个 gitlink
          git rm --cached -r --ignore-unmatch MyNode

          # 重新作为普通文件添加
          git add MyNode

          if git diff --cached --quiet; then
            echo "没有文件变化"
          else
            SYNC_TIME=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')
            git commit -m " 北京时间(${SYNC_TIME}) 同步 FreeSubsCheck [skip ci]"
            git push origin HEAD:master
          fi