name: 同步 FreeSubsCheck

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout 当前仓库
        uses: actions/checkout@v6

      - name: 获取 FreeSubsCheck
        uses: actions/checkout@v6
        with:
          repository: kooker/FreeSubsCheck
          ref: main
          path: FreeSubsCheck

      - name: 查看文件
        run: |
          find FreeSubsCheck -maxdepth 2 -type f | sort

      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add FreeSubsCheck

          if git diff --cached --quiet; then
            echo "没有文件变化"
          else
            git commit -m "同步 FreeSubsCheck  [skip ci]"
            git push
          fi